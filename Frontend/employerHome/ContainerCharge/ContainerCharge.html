<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tính phí Container</title>
    <link rel="stylesheet" href="../employerHome.css">
    <script src="ContainerCharge.js" defer></script>
</head>
<body>
    <header>
        <h1>Tính phí Container</h1>
    </header>
    <nav class="navbar">
        <ul>
            <li><a href="/Frontend/employerHome/Home/employerHome.html">Trang chủ</a></li>
            <li><a href="/Frontend/employerHome/Booking/booking.html">Nhập Booking</a></li>
            <li><a href="/Frontend/employerHome/ContainerCharge/ContainerCharge.html" class="active">Tính phí Container</a></li>
        </ul>
    </nav>
    <div class="container container-charge" style="max-width:80vw; width:80vw;">
        <!-- Summary Panel -->
        <div id="summaryPanel" class="summary-panel">
            <div class="summary-item">
                <div class="summary-label">Tổng Booking</div>
                <div id="totalBookings" class="summary-value summary-blue">0</div>
            </div>
            <div class="summary-item">
                <div class="summary-label">Tổng Container</div>
                <div id="totalContainers" class="summary-value summary-green">0</div>
            </div>
            <div class="summary-item">
                <div class="summary-label">Tổng Số lượng</div>
                <div id="totalQuantity" class="summary-value summary-orange">0</div>
            </div>
        </div>
        <div class="booking-list-panel">
            <h2>Danh sách Booking</h2>
            <button id="refreshBookingBtn" style="margin-bottom:10px; background:#2196F3; color:#fff; border:none; border-radius:5px; padding:8px 18px; font-weight:500; cursor:pointer;">Làm mới dữ liệu</button>
            <div style="overflow-x:auto;">
                <table id="bookingList">
                    <thead>
                        <tr>
                            <th>Ngày lấy</th>
                            <th>Công ty</th>
                            <th>Nhà xe</th>
                            <th>BK No</th>
                            <th>Mã số Container</th>
                            <th>Seal</th>
                            <th style="width:80px;">Loại hình</th>
                            <th style="width:5px;">Số lượng</th>
                            <th style="width:10px;">Kích cỡ</th>
                            <th>Nơi lấy Container</th>
                            <th>Nơi hạ Container</th>
                            <th>Chi phí phụ</th>
                        </tr>
                        <tr id="filterRow">
                            <th><input type="date" id="filter-pickup_date" style="width:100%"></th>
                            <th><select id="filter-company_name" style="width:110%"><option value="">Tất cả</option></select></th>
                            <th><select id="filter-transporter_name" style="width:100%"><option value="">Tất cả</option></select></th>
                            <th><input type="text" id="filter-booking_no" style="width:100%"></th>
                            <th><input type="text" id="filter-container_code" style="width:100%"></th>
                            <th><input type="text" id="filter-seal" style="width:100%"></th>
                            <th><input type="text" id="filter-type" style="width:100%" ></th>
                            <th><input type="text" id="filter-quantity" style="width:100%" ></th>
                            <th><input type="text" id="filter-size" style="width:100%" ></th>
                            <th><input type="text" id="filter-pickup_location" style="width:100%"></th>
                            <th><input type="text" id="filter-dropoff_location" style="width:100%"></th>
                            <th><input type="text" id="filter-extra_fee" style="width:100%"></th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Dữ liệu sẽ được thêm vào đây -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
