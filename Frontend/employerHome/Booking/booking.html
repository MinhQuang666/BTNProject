<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Booking</title>
    <link rel="stylesheet" href="../employerHome.css">
    <script src="booking.js" defer></script>
    <link rel="stylesheet" href="select2.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="select2.min.js"></script>
</head>
<body>
    <header>
        <h1>Quản lý Booking</h1>
    </header>
    <nav class="navbar">
        <ul>
            <li><a href="/Frontend/employerHome/Home/employerHome.html">Trang chủ</a></li>
            <li><a href="/Frontend/employerHome/Booking/booking.html" class="active">Nhập Booking</a></li>
            <li><a href="/Frontend/employerHome/ContainerCharge/ContainerCharge.html">Tính phí Container</a>
        </ul>
    </nav>
    
    <!-- Toast notification -->
    <div id="toast" style="display:none; position:fixed; top:20px; right:20px; z-index:9999; min-width:200px; padding:10px; background:#333; color:#fff; border-radius:5px; text-align:center;"></div>
    <!-- Loading spinner -->
    <div id="spinner" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); z-index:9998;">
        <div class="loader"></div>
    </div>
    
        <!-- Bảng danh sách Booking -->
        <div id="bookingListContainer">
            <h2>Danh sách Booking</h2>
            <button id="refreshBookingBtn" style="margin-bottom:10px; background:#2196F3; color:#fff; border:none; border-radius:5px; padding:8px 18px; font-weight:500; cursor:pointer;">Làm mới dữ liệu</button>
            <button id="toggleActionColBtn" style="margin-bottom:10px; background:#FF9800; color:#fff; border:none; border-radius:5px; padding:8px 18px; font-weight:500; cursor:pointer;">Hiện cột Hành động</button>
            <table id="bookingList">
                <caption>
                    <button id="newBookingButton" class="btn btn-primary" onclick="showBookingForm()">+ Booking mới</button>
                </caption>
                <thead>
                    <tr>
                        <th>Ngày lấy</th>
                        <th>Công ty</th>
                        <th>Nhà xe</th>
                        <th>BK No</th>
                        <th>Mã số Container</th>
                        <th>Seal</th>
                        <th style="width:70px;">Loại hình</th>
                        <th style="width:70px;">Số lượng</th>
                        <th style="width:70px;">Kích cỡ</th>
                        <th>Nơi lấy Container</th>
                        <th>Nơi hạ Container</th>
                        <th>Chi phí phụ</th>
                        <th id="actionHeader" style="display:none;">Hành động</th>
                    </tr>
                    <tr id="filterRow">
                        <th><input type="date" id="filter-pickup_date" style="width:100%"></th>
                        <th><select id="filter-company_name" style="width:100%"><option value="">--Tất cả--</option></select></th>
                        <th><select id="filter-transporter_name" style="width:100%"><option value="">--Tất cả--</option></select></th>
                        <th><input type="text" id="filter-booking_no" style="width:100%"></th>
                        <th><input type="text" id="filter-container_code" style="width:100%"></th>
                        <th><input type="text" id="filter-seal" style="width:100%"></th>
                        <th><input type="text" id="filter-type" style="width:100%" placeholder="Nhập/Xuất"></th>
                        <th><input type="text" id="filter-quantity" style="width:100%" placeholder="Số lượng"></th>
                        <th><input type="text" id="filter-size" style="width:100%" placeholder="Kích cỡ"></th>
                        <th><input type="text" id="filter-pickup_location" style="width:100%"></th>
                        <th><input type="text" id="filter-dropoff_location" style="width:100%"></th>
                        <th><input type="text" id="filter-extra_fee" style="width:100%"></th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Dữ liệu sẽ được thêm vào đây -->
                </tbody>
            </table>
        </div>
        <main id="main-container"></main>
        <!-- Bảng nhập Booking -->
        <div id="draggableContainer" class="container" style="display: none;">
            <h1>Nhập Thông Tin Booking</h1>
            <form id="bookingForm" autocomplete="off">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="pickupDate">Ngày lấy:</label>
                        <input type="date" id="pickupDate" name="pickupDate" required>
                    </div>
                    <div class="form-group">
                        <label for="company">Công ty:</label>
                        <select id="company" name="company" required>
                            <option value="">-- Chọn công ty --</option>
                            <!-- Options sẽ được thêm bằng JS -->
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="transporter">Nhà xe:</label>
                        <select id="transporter" name="transporter" required>
                            <option value="">-- Chọn nhà xe --</option>
                            <!-- Options sẽ được thêm bằng JS -->
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="bookingNo">BK No:</label>
                        <input type="text" id="bookingNo" name="bookingNo" placeholder="Số Booking" required>
                    </div>
                    <div class="form-group">
                        <label for="containerNo">Mã số Container:</label>
                        <input type="text" id="containerNo" name="containerNo" placeholder="Mã số Container" required pattern="^[A-Z]{4}[0-9]{7}$" title="4 chữ cái in hoa + 7 số, ví dụ: ABCD1234567">
                    </div>
                    <div class="form-group">
                        <label for="seal">Seal:</label>
                        <input type="text" id="seal" name="seal" placeholder="Seal" required>
                    </div>
                    <div class="form-group">
                        <label for="quantity">Số lượng:</label>
                        <input type="number" id="quantity" name="quantity" placeholder="Số lượng" required value="1">
                    </div>
                    <div class="form-group">
                        <label for="size">Kích cỡ:</label>
                        <select id="size" name="size" required>
                            <option value="20">20'</option>
                            <option value="40" selected>40'</option>
                            <option value="45">45'</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="pickupLocation">Nơi lấy Container:</label>
                        <input type="text" id="pickupLocation" name="pickupLocation" placeholder="Địa điểm lấy Container" required>
                    </div>
                    <div class="form-group">
                        <label for="dropoffLocation">Nơi hạ Container:</label>
                        <input type="text" id="dropoffLocation" name="dropoffLocation" placeholder="Địa điểm hạ Container" required>
                    </div>
                    <div class="form-group">
                        <label for="type">Loại hình:</label>
                        <select id="type" name="type" required>
                            <option value="import">Nhập</option>
                            <option value="export" selected>Xuất</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="extraFee">Chi phí phụ:</label>
                        <input type="text" id="extraFee" name="extraFee" placeholder="Cược phí phụ" required>
                    </div>
                </div>
                <div class="form-buttons">
                    <button type="submit" class="btn btn-success">Lưu</button>
                    <button type="button" class="btn btn-cancel" onclick="hideBookingForm()" style="background-color: red; color: white;">Hủy</button>
                </div>
            </form>
        </div>
    </main>
    <script>
document.addEventListener('DOMContentLoaded', function() {
    // Set pickupDate to today by default
    var today = new Date();
    var yyyy = today.getFullYear();
    var mm = String(today.getMonth() + 1).padStart(2, '0');
    var dd = String(today.getDate()).padStart(2, '0');
    var todayStr = yyyy + '-' + mm + '-' + dd;
    var pickupDateInput = document.getElementById('pickupDate');
    if (pickupDateInput) {
        pickupDateInput.value = todayStr;
    }
});

document.getElementById('bookingForm').addEventListener('submit', function(e) {
    var containerNo = document.getElementById('containerNo').value.trim();
    var regex = /^[A-Z]{4}[0-9]{7}$/;
    if (!regex.test(containerNo)) {
        showToast('Mã số Container phải gồm 4 chữ cái in hoa + 7 số (VD: ABCD1234567)');
        document.getElementById('containerNo').focus();
        e.preventDefault();
        return false;
    }
    // ...existing code for submit...
});

document.getElementById('toggleActionColBtn').addEventListener('click', function() {
    const table = document.getElementById('bookingList');
    const actionHeader = document.getElementById('actionHeader');
    const rows = table.querySelectorAll('tbody tr');
    const show = actionHeader.style.display === 'none';
    actionHeader.style.display = show ? '' : 'none';
    // Hiện/ẩn từng ô hành động trong tbody
    rows.forEach(row => {
        if (row.children.length > 12) {
            row.children[12].style.display = show ? '' : 'none';
        }
    });
    // Đổi text nút
    this.textContent = show ? 'Ẩn cột Hành động' : 'Hiện cột Hành động';
});

function showToast(msg) {
    var toast = document.getElementById('toast');
    toast.innerText = msg;
    toast.style.display = 'block';
    setTimeout(function() { toast.style.display = 'none'; }, 3000);
}

// Khi render bảng booking, mặc định ẩn cột hành động
function renderBookingList() {
    // ...existing code...
    pageBookings.forEach(booking => {
        const newRow = document.createElement('tr');
        newRow.innerHTML = `
            <td>${formatDate(booking.pickup_date) || ''}</td>
            <td>${booking.company_name || ''}</td>
            <td>${booking.transporter_name || ''}</td>
            <td>${booking.booking_no || ''}</td>
            <td>${booking.container_code || ''}</td>
            <td>${booking.seal || ''}</td>
            <td>${booking.type === 'import' ? 'Nhập' : booking.type === 'export' ? 'Xuất' : (booking.type || '')}</td>
            <td>${booking.quantity || ''}</td>
            <td>${booking.size || ''}</td>
            <td>${booking.pickup_location || ''}</td>
            <td>${booking.dropoff_location || ''}</td>
            <td>${booking.extra_fee || ''}</td>
            <td style="display:none"><button onclick="deleteBooking(this)">Xóa</button></td>
        `;
        tableBody.appendChild(newRow);
    });
    // ...existing code...
}

// Tích hợp Select2 cho select công ty (form)
$('#company').select2({
    width: '100%',
    placeholder: '-- Chọn công ty --',
    allowClear: true,
    minimumResultsForSearch: 0, // Luôn hiện thanh tìm kiếm
    ajax: {
        url: 'http://localhost:3000/companies',
        dataType: 'json',
        delay: 250,
        data: function(params) {
            return {
                search: params.term || '',
                limit: 20
            };
        },
        processResults: function(data) {
            return {
                results: (data.companies || []).map(function(company) {
                    return { id: company.name, text: company.name };
                })
            };
        },
        cache: true
    },
    language: {
        inputTooShort: function() { return 'Nhập để tìm công ty'; },
        noResults: function() { return 'Không tìm thấy công ty phù hợp'; },
        searching: function() { return 'Đang tìm...'; }
    },
    minimumInputLength: 0
});
// Tích hợp Select2 cho select filter công ty (lọc bảng)
$('#filter-company_name').select2({
    width: '100%',
    placeholder: '--Tất cả--',
    allowClear: true,
    minimumResultsForSearch: 0, // Luôn hiện thanh tìm kiếm
    ajax: {
        url: 'http://localhost:3000/companies',
        dataType: 'json',
        delay: 250,
        data: function(params) {
            return {
                search: params.term || '',
                limit: 20
            };
        },
        processResults: function(data) {
            return {
                results: (data.companies || []).map(function(company) {
                    return { id: company.name, text: company.name };
                })
            };
        },
        cache: true
    },
    language: {
        inputTooShort: function() { return 'Nhập để tìm công ty'; },
        noResults: function() { return 'Không tìm thấy công ty phù hợp'; },
        searching: function() { return 'Đang tìm...'; }
    },
    minimumInputLength: 0
});
// Khi chọn filter-company_name thì trigger filterBookingTable nếu có
$('#filter-company_name').on('change', function() {
    if (typeof filterBookingTable === 'function') filterBookingTable();
});
</script>
</body>
</html>
